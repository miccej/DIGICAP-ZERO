<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Full Bleed Premium Deep Navy Background -->
  <rect width="512" height="512" fill="#081427" />

  <!-- Bold Typographical Block perfectly centered and optimized for visibility -->
  <g transform="translate(256, 0)">
    <!-- DIGI - Line 1 (Super White, bold font-size and optimized vertical positioning) -->
    <text 
      x="0" 
      y="215" 
      text-anchor="middle" 
      fill="#ffffff" 
      stroke="#ffffff" 
      stroke-width="7" 
      stroke-linejoin="round" 
      paint-order="stroke fill" 
      style="font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; font-size: 175px; letter-spacing: -0.05em;"
    >
      DIGI
    </text>
    
    <!-- CAP - Line 2 (Super White, bold font-size) -->
    <text 
      x="0" 
      y="370" 
      text-anchor="middle" 
      fill="#ffffff" 
      stroke="#ffffff" 
      stroke-width="7" 
      stroke-linejoin="round" 
      paint-order="stroke fill" 
      style="font-family: 'Arial Black', 'Impact', sans-serif; font-weight: 900; font-size: 175px; letter-spacing: -0.05em;"
    >
      CAP
    </text>

    <!-- CMK/CPK/PPK Subtitle (Super White, positioned neatly at the bottom with high readability) -->
    <text
      x="0"
      y="445"
      text-anchor="middle"
      fill="#ffffff"
      style="font-family: 'Arial Black', 'Impact', 'Inter', sans-serif; font-weight: 900; font-size: 32px; letter-spacing: 0.08em;"
    >
      CMK/CPK/PPK
    </text>
  </g>
</svg>
